# Builds the installers of every platform and uploads them as workflow artifacts.
# Run it from the Actions tab (Run workflow), or push a v* tag.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          # cross-compiled; the MSI bundler is left out, NSIS is the ARM64 installer
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macos-arm64
            os: macos-26
            target: aarch64-apple-darwin
            bundles: app,dmg
          # cross-compiled on the ARM64 runner
          - name: macos-x64
            os: macos-26
            target: x86_64-apple-darwin
            bundles: app,dmg
          # the oldest supported Ubuntu, so the packages also run on older glibc versions
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-alsa gstreamer1.0-pulseaudio libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          # ad-hoc signature: without any, macOS reports the app as damaged on Apple Silicon
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}

      # Tauri deletes the .app when only a DMG is asked for, so the matrix asks for both.
      - name: Verify the macOS app icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/VA SID Studio.app"
          test -s "$APP/Contents/Resources/Assets.car"
          cmp src-tauri/icons/generated/Assets.car "$APP/Contents/Resources/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Contents/Info.plist")" = AppIcon
          test -s "$APP/Contents/Resources/icon.icns"
          codesign --verify --deep --strict "$APP"

      # WebKitGTK plays Web Audio through GStreamer: without these the player runs in silence.
      - name: Verify the sound plugins of the Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BUNDLE="$PWD/src-tauri/target/${{ matrix.target }}/release/bundle"
          dpkg-deb -f "$BUNDLE"/deb/*.deb Depends | grep -q gstreamer1.0-plugins-good
          cd "$(mktemp -d)"
          "$BUNDLE"/appimage/*.AppImage --appimage-extract > /dev/null
          for plugin in libgstapp.so libgstautodetect.so; do
            find squashfs-root -name "$plugin" | grep -q . || { echo "missing: $plugin"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: va-sid-studio-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  manual:
    name: SID manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v7
        with:
          name: va-sid-studio-manual
          if-no-files-found: error
          path: docs/VA SID Studio Manual.pdf
