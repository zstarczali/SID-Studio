name: Publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Build installers run ID (from its Actions URL)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-sids-ftp
  cancel-in-progress: false

jobs:
  publish:
    name: Publish installers and manual to FTP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate source build
        id: source
        run: python3 scripts/publish-artifacts.py --validate-run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.run_id }}

      # download-artifact extracts the ZIPs; each artifact keeps its own directory.
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: va-sid-studio-*
          path: publish-artifacts

      # Older builds have no manual artifact. Use their exact commit's PDF,
      # rather than a possibly newer manual from the Publish workflow branch.
      - name: Check out the source build manual
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          path: source-build
          sparse-checkout: docs/VA SID Studio Manual.pdf
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Upload extracted installers and SID manual
        run: python3 scripts/publish-artifacts.py publish-artifacts
        env:
          FTP_HOST: ftpx.forpsi.com
          FTP_USERNAME: www.c64va.pro
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIRECTORY: /www/downloads/SIDS/
          SID_MANUAL_PATH: source-build/docs/VA SID Studio Manual.pdf
