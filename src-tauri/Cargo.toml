[package]
name = "va-sid-studio"
version = "1.8.5"
edition = "2021"
license = "MIT"

[lib]
name = "va_sid_studio_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# the SID emulation shared with C64 Visual Assembler (VA SID Core, reSID, 6510 / CIA / VIC-II, .sid sessions)
va-sid = { git = "https://github.com/zstarczali/VA-SID.git", rev = "58d7206d13e7c5ba4c5e6888110ec78223f93a13" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["ppmd"] }
urlencoding = "2"
# unpacks the Modland catalog (allmods.zip)
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# assembles the exported player for playback and the .sid export
vma = { git = "https://github.com/zstarczali/VMA.git", branch = "main" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# a second launch with a .sidpl file goes to the running window
tauri-plugin-single-instance = "2"

# the SID emulation runs slower than real time unoptimised
# the version wry uses: it moves together with Tauri
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
